name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-workflow-pins.test.sh && scripts/check-workflow-pins.sh

  test:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  vuln:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...

  dogfood:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
      - run: go run ./cmd/llm-lint scan --fail-on error

  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test, lint, vuln, dogfood]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true

      # Node and the npm credential check come FIRST, before anything
      # irreversible. Everything below this point - the GitHub release, the
      # ghcr.io images, the sigstore transparency log entries - cannot be
      # undone, and on v0.4.0 all of it succeeded while the npm publish at the
      # very end failed on an expired token. That left GitHub advertising a
      # release that npm had never heard of. Checking the credential takes about
      # a second; discovering it is dead at the last step costs a manual
      # recovery. See npm/scripts/check-npm-auth.mjs.
      - name: Setup Node for npm publish
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'


      # actions/setup-node with `registry-url` ALWAYS writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # into the .npmrc. When there is no token that line resolves to an empty
      # value, and npm reads "auth is configured for this registry" - so it never
      # starts the OIDC exchange and instead attempts a classic publish with empty
      # credentials. The result is `ENEEDAUTH: This command requires you to be
      # logged in`, which points at the account rather than at this line.
      #
      # v0.4.1 failed this way twice with trusted publishers correctly configured.
      # Known issue: actions/setup-node#1551, npm/documentation#1960, and
      # npm/cli#9088 for the misleading error.
      - name: Let npm reach trusted publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "token mode: leaving the .npmrc auth line in place"
            exit 0
          fi
          if [ ! -f "$npmrc" ]; then
            echo "no .npmrc at $npmrc; nothing to strip"
            exit 0
          fi
          if grep -q '_authToken' "$npmrc"; then
            sed -i '/_authToken/d' "$npmrc"
            echo "stripped the empty _authToken line so npm will use OIDC"
          else
            echo "no _authToken line present"
          fi

      - name: npm auth preflight
        run: node npm/scripts/check-npm-auth.mjs
        env:
          # Empty when the secret is absent, which check-npm-auth.mjs reads as
          # "use trusted publishing (OIDC)". Moving to trusted publishing is
          # therefore just deleting this secret - no workflow change.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: npm manifest consistency
        run: node npm/scripts/check-manifests.mjs

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build npm packages
        run: node npm/scripts/build.mjs --version "${GITHUB_REF_NAME#v}"

      # --skip-existing makes this step re-runnable. There are seven packages to
      # publish (six platform binaries plus the parent), so a failure partway
      # through - an expired token, a registry blip - would otherwise leave the
      # earlier ones published and hard-fail every retry on "cannot publish over
      # previously published version".
      - name: Publish to npm
        run: node npm/scripts/publish.mjs --version "${GITHUB_REF_NAME#v}" --provenance --skip-existing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # A green `npm publish` only proves the upload was accepted. This installs
      # the parent from the public registry the way a user would and runs the
      # binary, which is the claim that actually matters.
      - name: Verify the release is installable from npm
        run: node npm/scripts/verify-published.mjs --version "${GITHUB_REF_NAME#v}"
