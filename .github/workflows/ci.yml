name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: scripts/check-workflow-pins.test.sh && scripts/check-workflow-pins.sh

  test:
    needs: policy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -coverprofile=coverage.out ./...
      - name: Test (race)
        if: matrix.os != 'ubuntu-latest'
        run: go test -race ./...
      - name: Coverage threshold
        if: matrix.os == 'ubuntu-latest'
        # Threshold pinned to current baseline (~82%) minus a small buffer.
        # Bump when coverage rises sustainably; lower only with explicit
        # justification in the PR description.
        env:
          THRESHOLD: '80'
        run: |
          set -euo pipefail
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"
          awk -v cov="$COVERAGE" -v th="$THRESHOLD" \
            'BEGIN { if (cov+0 < th+0) { printf "coverage %s%% below threshold %s%%\n", cov, th; exit 1 } }'
      - name: Upload coverage artifact
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14

  lint:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: gofmt check
        run: |
          set -euo pipefail
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  vuln:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        run: govulncheck ./...

  # The npm distribution is built and published exactly once per release, inside
  # the job that also cuts the GitHub release - so until now nothing exercised it
  # on a pull request. That is how Renovate's "update node.js to v24" reached main
  # having rewritten the *published* package's engines.node from ">=18.20.8" to
  # ">=24.15.0", which would have made `npx @jadenrazo/llm-lint` fail for every
  # user on Node 18, 20 or 22 LTS. It sat there for months.
  #
  # Everything here is a pure function of the commit: no registry, no network, no
  # credentials. It is safe as a required status check.
  npm-dist:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - name: Syntax-check the packaging scripts
        run: |
          set -euo pipefail
          for f in npm/scripts/*.mjs npm/bin/*.js; do
            node --check "$f"
          done
      - name: Manifest consistency
        run: node npm/scripts/check-manifests.mjs
      - name: Packaging smoke build
        run: node npm/scripts/smoke-build.mjs

  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, lint, vuln]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Generate SARIF (always uploads, even on findings)
        run: go run ./cmd/llm-lint scan --format sarif --output llm-lint.sarif || true
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('llm-lint.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: llm-lint.sarif
          category: llm-lint
      - name: Self-scan (gate on error severity)
        run: go run ./cmd/llm-lint scan --fail-on error
