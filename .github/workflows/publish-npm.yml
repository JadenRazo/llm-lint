name: publish-npm

# Publishes the npm half of a release on its own, from the archives already
# attached to the GitHub release.
#
# release.yml does everything in one job: build, sign, GitHub release, ghcr
# images, then npm. When only the last step fails there was previously no way to
# finish the release - re-running goreleaser against an existing tag fails, and
# moving the tag rewrites a published, signed release. So v0.4.0 sat published on
# GitHub and missing from npm for over a week.
#
# This replays only the npm step, from the exact bytes users already download,
# with every archive checksum-verified against the release's own checksums.txt.
# It is safe to run repeatedly: already-published versions are skipped.
#
# For a fresh release, prefer dispatching against the tag itself so the npm
# provenance attestation names the tag rather than the branch:
#
#   gh workflow run publish-npm.yml --ref v1.2.3 -f tag=v1.2.3
#
# (that requires this workflow file to exist at that tag; for older tags, run it
# from main and the attestation will name main instead.)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to npm, e.g. v0.4.0'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag. Blank = latest for a release, next for a prerelease.'
        required: false
        type: string
      dry_run:
        description: 'Build and validate everything, but do not publish.'
        required: false
        type: boolean
        default: false
      auth:
        description: 'How to authenticate the publish. oidc = npm trusted publishing (no token). token = the NPM_TOKEN secret.'
        required: false
        type: choice
        default: oidc
        options: [oidc, token]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - name: Validate the tag input
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The tag reaches a shell and `gh release download`, so constrain it to
          # a semver tag rather than trusting dispatch input.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag must look like v1.2.3 or v1.2.3-rc.1, got '$TAG'"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          # The parent package ships bin/llm-lint.js and npm/README.md from the
          # working tree, so it must be the tree the release was cut from.
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'


      # actions/setup-node with `registry-url` ALWAYS writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # into the .npmrc. When there is no token that line resolves to an empty
      # value, and npm reads "auth is configured for this registry" - so it never
      # starts the OIDC exchange and instead attempts a classic publish with empty
      # credentials. The result is `ENEEDAUTH: This command requires you to be
      # logged in`, which points at the account rather than at this line.
      #
      # v0.4.1 failed this way twice with trusted publishers correctly configured.
      # Known issue: actions/setup-node#1551, npm/documentation#1960, and
      # npm/cli#9088 for the misleading error.
      - name: Let npm reach trusted publishing
        env:
          NODE_AUTH_TOKEN: ${{ inputs.auth == 'token' && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "token mode: leaving the .npmrc auth line in place"
            exit 0
          fi
          if [ ! -f "$npmrc" ]; then
            echo "no .npmrc at $npmrc; nothing to strip"
            exit 0
          fi
          if grep -q '_authToken' "$npmrc"; then
            sed -i '/_authToken/d' "$npmrc"
            echo "stripped the empty _authToken line so npm will use OIDC"
          else
            echo "no _authToken line present"
          fi

      - name: npm auth preflight
        run: node npm/scripts/check-npm-auth.mjs
        env:
          NODE_AUTH_TOKEN: ${{ inputs.auth == 'token' && secrets.NPM_TOKEN || '' }}

      - name: npm manifest consistency
        run: node npm/scripts/check-manifests.mjs

      - name: Download the release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir .release-assets \
            --clobber \
            --pattern 'llm-lint_*.tar.gz' \
            --pattern 'llm-lint_*.zip' \
            --pattern 'checksums.txt'
          ls -la .release-assets

      - name: Extract and checksum-verify the binaries
        env:
          TAG: ${{ inputs.tag }}
        run: node npm/scripts/from-release.mjs --assets .release-assets --out .release-bins --version "${TAG#v}"

      - name: Build npm packages
        env:
          TAG: ${{ inputs.tag }}
        run: node npm/scripts/build.mjs --version "${TAG#v}" --dist .release-bins

      - name: Publish to npm
        env:
          TAG: ${{ inputs.tag }}
          DIST_TAG: ${{ inputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Deliberately empty in oidc mode. setup-node writes an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}`, and npm authenticates with that token
          # in preference to trusted publishing - so leaving a token in the
          # environment silently disables OIDC. v0.4.1 failed with EOTP twice for
          # exactly this reason, with trusted publishers already configured.
          NODE_AUTH_TOKEN: ${{ inputs.auth == 'token' && secrets.NPM_TOKEN || '' }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          args=(--version "${TAG#v}" --provenance --skip-existing)
          [ -n "$DIST_TAG" ] && args+=(--tag "$DIST_TAG")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          node npm/scripts/publish.mjs "${args[@]}"

      - name: Verify the release is installable from npm
        if: ${{ inputs.dry_run != true }}
        env:
          TAG: ${{ inputs.tag }}
        run: node npm/scripts/verify-published.mjs --version "${TAG#v}"

      - name: Confirm npm and GitHub now agree
        # Only meaningful for the newest release; a backfill of an older tag is
        # expected to leave `latest` pointing elsewhere, so this reports without
        # failing the job.
        if: ${{ always() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node npm/scripts/check-release-sync.mjs
