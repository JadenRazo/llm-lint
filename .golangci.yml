version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - noctx
  exclusions:
    rules:
      - linters: [errcheck]
        path: internal/report/.*\.go
        text: "fmt\\.(Fprint|Fprintf|Fprintln|Print|Printf|Println)"
      # Unchecked Close is acceptable only in defer cleanup; a bare
      # non-deferred Close must handle (or explicitly discard) the error.
      - linters: [errcheck]
        source: "^\\s*defer\\b"
        text: "\\.Close"

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 3m
